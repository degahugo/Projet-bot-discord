# --- Base de données ----------------------------------------------------------
# En dev (./mvnw quarkus:dev) et en test, AUCUNE URL n'est donnée :
# Quarkus "Dev Services" démarre automatiquement un PostgreSQL dans Docker
# (via Testcontainers). Il faut juste que Docker tourne.
quarkus.datasource.db-kind=postgresql

# Recrée le schéma à chaque démarrage en dev/test (pratique, jamais en prod).
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/bot
%dev.quarkus.datasource.username=bot
%dev.quarkus.datasource.password=bot
# "update" : ajoute les nouvelles colonnes sans effacer les donn�es existantes
%dev.quarkus.hibernate-orm.schema-management.strategy=update
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# En prod, la base est fournie par variables d'environnement :
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/bot}
%prod.quarkus.datasource.username=${DB_USER:bot}
%prod.quarkus.datasource.password=${DB_PASSWORD:bot}

# --- API ----------------------------------------------------------------------
quarkus.http.port=8080
quarkus.swagger-ui.always-include=true


# --- Contrat OpenAPI ----------------------------------------------------------
# A chaque build (package), écrit openapi.yaml et openapi.json dans contracts/ à la racine du dépot.
# Ce fichier est le contrat publié par bot-api : discord-bot génére son client à partir de lui.
quarkus.smallrye-openapi.store-schema-directory=../../contracts