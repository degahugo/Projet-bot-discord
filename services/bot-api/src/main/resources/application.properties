# --- Base de données ----------------------------------------------------------
# En dev (./mvnw quarkus:dev) et en test, AUCUNE URL n'est donnée :
# Quarkus "Dev Services" démarre automatiquement un PostgreSQL dans Docker
# (via Testcontainers). Il faut juste que Docker tourne.
quarkus.datasource.db-kind=postgresql

# Recrée le schéma à chaque démarrage en dev/test (pratique, jamais en prod).
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# En prod, la base est fournie par variables d'environnement :
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/bot}
%prod.quarkus.datasource.username=${DB_USER:bot}
%prod.quarkus.datasource.password=${DB_PASSWORD:bot}

# --- API ----------------------------------------------------------------------
quarkus.http.port=8080
quarkus.swagger-ui.always-include=true
