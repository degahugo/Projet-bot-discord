# Port différent de bot-api (8080) pour lancer les deux en même temps
quarkus.http.port=8081

# Jeton Discord : variable d'environnement DISCORD_TOKEN.
# En dev, Quarkus lit automatiquement le fichier .env à la racine du module
# (services/discord-bot/.env, ignoré par Git).
discord.token=${DISCORD_TOKEN:}

# En test, on ne se connecte pas à Discord
%test.discord.enabled=false
