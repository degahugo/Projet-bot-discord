# Port diffÃ©rent de bot-api (8080) pour lancer les deux en mÃªme temps
quarkus.http.port=8081

# Jeton Discord : variable d'environnement DISCORD_TOKEN.
# En dev, Quarkus lit automatiquement le fichier .env Ã  la racine du module
# (services/discord-bot/.env, ignorÃ© par Git).
discord.token=${DISCORD_TOKEN:}

# En test, on ne se connecte pas Ã  Discord
%test.discord.enabled=false

# --- Génération du client depuis le contrat de bot-api ------------------------
# Le contrat est lu directement à la racine du dépôt : un seul fichier pour les deux services.
quarkus.openapi-generator.codegen.input-base-dir=../../contracts
# On ne génère qu'à partir du YAML (le JSON contient la même chose : sinon classes en double)
quarkus.openapi-generator.codegen.include=openapi.yaml
# "openapi_yaml" = nom du fichier, avec le point remplacé par un underscore
quarkus.openapi-generator.codegen.spec.openapi_yaml.base-package=org.acme.bot.client
# Clé de configuration du client généré : on garde "bot-api" pour l'URL ci-dessous
quarkus.openapi-generator.codegen.spec.openapi_yaml.config-key=bot-api

# --- Client REST vers bot-api -------------------------------------------------
# En local : http://localhost:8080. Sous Docker Compose : http://bot-api:8080 (nom du service).
quarkus.rest-client.bot-api.url=${BOT_API_URL:http://localhost:8080}

# Timeouts en millisecondes : si bot-api ne répond pas, le bot ne reste pas bloqué
quarkus.rest-client.bot-api.connect-timeout=2000
quarkus.rest-client.bot-api.read-timeout=5000